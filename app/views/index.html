<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Odoo Client Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1ca165;
    }

    header {
      background: #1ca165;
      color: white;
      padding: 16px 32px;
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .tabs {
      display: flex;
      background: #1ca165;
    }
    .tab-btn {
      padding: 12px 28px;
      color: #000;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      transition: background .2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #08ff90;
      color: #000;
    }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: #000000;
      border-bottom: 2px solid #f0e6ed;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #000;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border .2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #1ca165;
    }

    button[type="submit"] {
      background: #1ca165;
      color: white;
      border: none;
      padding: 11px 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background .2s;
    }
    button[type="submit"]:hover { background: #155724; }
    button[type="submit"]:disabled { background: #aaa; cursor: not-allowed; }

    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error   { background: #f8d7da; color: #771d1d; border: 1px solid #f5c6cb; }
    .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      background: #f8f0f5;
      color: #155724;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      color: #000000
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fdf6fb; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-ok      { background: #d4edda; color: #155724; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-error   { background: #f8d7da; color: #000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>

<header>Odoo Client Manager</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('clients')">👥 Clients</button>
  <button class="tab-btn" onclick="showTab('orders')">🛒 Commandes</button>
</div>

<div class="container">

  <div id="tab-clients" class="tab-content active">

    <div class="card">
      <h2> Créer un client</h2>
      <div id="client-alert" class="alert"></div>
      <div class="form-group">
        <label>Nom *</label>
        <input type="text" id="c-name" placeholder="Moise Gondo" />
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" id="c-phone" placeholder="+225 07 00 00 00 00" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="c-email" placeholder="moise@mailexemple.com" />
      </div>
      <button type="submit" id="btn-create-client" onclick="createClient()">Valider</button>
    </div>

    <div class="card">
      <h2>Liste des clients</h2>
      <div id="clients-table-container">
        <p class="empty-state">Chargement…</p>
      </div>
    </div>

  </div>

  <div id="tab-orders" class="tab-content">

    <div class="card">
      <h2> Créer une commande</h2>
      <div id="order-alert" class="alert"></div>
      <div class="form-group">
        <label>Client *</label>
        <select id="o-client">
          <option value="">-- Sélectionner un client --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Produit *</label>
        <input type="text" id="o-product" placeholder="Iphone 14 pro" />
      </div>
      <div class="form-group">
        <label>Prix total (FCFA) *</label>
        <input type="number" id="o-amount" placeholder="380000" min="1" step="any" />
      </div>
      <button type="submit" id="btn-create-order" onclick="createOrder()">Valider la commande</button>
    </div>

    <div class="card">
      <h2> Liste des commandes</h2>
      <div id="orders-table-container">
        <p class="empty-state">Chargement…</p>
      </div>
    </div>

  </div>

</div>

<script>

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'orders') loadOrdersTab();
}

function showAlert(id, type, message) {
  const el = document.getElementById(id);
  el.className = `alert alert-${type} show`;
  el.textContent = message;
  setTimeout(() => el.classList.remove('show'), 6000);
}

async function createClient() {
  const name  = document.getElementById('c-name').value.trim();
  const phone = document.getElementById('c-phone').value.trim();
  const email = document.getElementById('c-email').value.trim();

  if (!name) { showAlert('client-alert', 'error', 'Le nom est obligatoire.'); return; }

  const btn = document.getElementById('btn-create-client');
  btn.disabled = true;
  btn.textContent = 'Création…';

  try {
    const res  = await fetch('/api/clients', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, phone, email }),
    });
    const data = await res.json();

    if (!data.success) {
      showAlert('client-alert', 'error', data.message);
      return;
    }

    if (data.odoo && !data.odoo.synced) {
      showAlert('client-alert', 'warning',
        `Client créé localement, mais erreur Odoo : ${data.odoo.error}`);
    } else {
      showAlert('client-alert', 'success',
        `Client créé et synchronisé dans Odoo (partner_id=${data.odoo.partner_id})`);
    }

    document.getElementById('c-name').value  = '';
    document.getElementById('c-phone').value = '';
    document.getElementById('c-email').value = '';
    loadClients();

  } catch (err) {
    showAlert('client-alert', 'error', 'Erreur réseau : ' + err.message);
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Créer le client';
  }
}

async function loadClients() {
  try {
    const res    = await fetch('/api/clients');
    const data   = await res.json();
    const clients = data.data || [];
    const container = document.getElementById('clients-table-container');

    if (clients.length === 0) {
      container.innerHTML = '<p class="empty-state">Aucun client pour l\'instant.</p>';
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>#</th><th>Nom</th><th>Téléphone</th><th>Email</th>
            <th>Odoo Partner ID</th><th>Sync</th><th>Créé le</th>
          </tr>
        </thead>
        <tbody>
          ${clients.map(c => `
            <tr>
              <td>${c.id}</td>
              <td><strong>${esc(c.name)}</strong></td>
              <td>${esc(c.phone || '—')}</td>
              <td>${esc(c.email || '—')}</td>
              <td>${c.odoo_partner_id || '—'}</td>
              <td>
                ${c.odoo_partner_id
                  ? '<span class="badge badge-ok">✓ Synchronisé</span>'
                  : c.odoo_sync_error
                    ? `<span class="badge badge-error" title="${esc(c.odoo_sync_error)}">✗ Erreur</span>`
                    : '<span class="badge badge-pending">⏳ En attente</span>'
                }
              </td>
              <td>${c.created_at}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    document.getElementById('clients-table-container').innerHTML =
      `<p class="empty-state" style="color:red">Erreur de chargement : ${err.message}</p>`;
  }
}

async function loadOrdersTab() {
  await Promise.all([loadClientSelect(), loadOrders()]);
}

async function loadClientSelect() {
  const res     = await fetch('/api/clients');
  const data    = await res.json();
  const select  = document.getElementById('o-client');
  const current = select.value;

  select.innerHTML = '<option value="">-- Sélectionner un client --</option>';
  (data.data || []).forEach(c => {
    const opt = document.createElement('option');
    opt.value       = c.id;
    opt.textContent = `${c.name}${c.odoo_partner_id ? '' : '(!!)'}`;
    if (String(c.id) === current) opt.selected = true;
    select.appendChild(opt);
  });
}

async function createOrder() {
  const clientId   = document.getElementById('o-client').value;
  const productName = document.getElementById('o-product').value.trim();
  const amount      = document.getElementById('o-amount').value;

  if (!clientId)    { showAlert('order-alert', 'error', 'Veuillez sélectionner un client.'); return; }
  if (!productName) { showAlert('order-alert', 'error', 'Le nom du produit est obligatoire.'); return; }
  if (!amount)      { showAlert('order-alert', 'error', 'Le montant est obligatoire.'); return; }

  const btn = document.getElementById('btn-create-order');
  btn.disabled    = true;
  btn.textContent = 'Création…';

  try {
    const res  = await fetch('/api/orders', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ client_id: clientId, product_name: productName, amount }),
    });
    const data = await res.json();

    if (!data.success) {
      showAlert('order-alert', 'error', data.message);
      return;
    }

    if (data.odoo && !data.odoo.synced) {
      showAlert('order-alert', 'warning',
        `Commande créée localement, mais erreur Odoo : ${data.odoo.error}`);
    } else {
      showAlert('order-alert', 'success',
        `Commande créée et synchronisée dans Odoo (sale.order id=${data.odoo.order_id})`);
    }

    document.getElementById('o-product').value = '';
    document.getElementById('o-amount').value  = '';
    loadOrders();

  } catch (err) {
    showAlert('order-alert', 'error', 'Erreur réseau : ' + err.message);
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Créer la commande';
  }
}

async function loadOrders() {
  try {
    const res    = await fetch('/api/orders');
    const data   = await res.json();
    const orders = data.data || [];
    const container = document.getElementById('orders-table-container');

    if (orders.length === 0) {
      container.innerHTML = '<p class="empty-state">Aucune commande pour l\'instant.</p>';
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>#</th><th>Client</th><th>Produit</th><th>Montant</th>
            <th>Odoo Order ID</th><th>Sync</th><th>Créé le</th>
          </tr>
        </thead>
        <tbody>
          ${orders.map(o => `
            <tr>
              <td>${o.id}</td>
              <td>${esc(o.client_name)}</td>
              <td>${esc(o.product_name)}</td>
              <td><strong>${Number(o.amount).toLocaleString('fr-CI')} FCFA</strong></td>
              <td>${o.odoo_order_id || '—'}</td>
              <td>
                ${o.odoo_order_id
                  ? '<span class="badge badge-ok">✓ Synchronisé</span>'
                  : o.odoo_sync_error
                    ? `<span class="badge badge-error" title="${esc(o.odoo_sync_error)}">✗ Erreur</span>`
                    : '<span class="badge badge-pending">⏳ En attente</span>'
                }
              </td>
              <td>${o.created_at}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    document.getElementById('orders-table-container').innerHTML =
      `<p class="empty-state" style="color:red">Erreur : ${err.message}</p>`;
  }
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadClients();
</script>
</body>
</html>
